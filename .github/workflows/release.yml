name: Package release

on:
  push:
    branches: [dev]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Allocate release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: python packaging/release_version.py
  package:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: BlueLCMS-linux-x86_64.tar.gz
          - os: macos-latest
            artifact: BlueLCMS-macos.dmg
          - os: windows-latest
            artifact: BlueLCMS-windows-setup.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Stamp application version
        run: python packaging/release_version.py --stamp "${{ needs.version.outputs.version }}"
      - name: Install build tools
        run: python -m pip install --upgrade pip pyinstaller pillow .
      - name: Generate Windows application icon
        if: runner.os == 'Windows'
        run: python packaging/windows/build_icon.py
      - name: Configure development update channel
        if: needs.version.outputs.prerelease == 'true'
        run: cp packaging/runtime_hooks/development.py runtime-hook.py
      - name: Configure stable update channel
        if: needs.version.outputs.prerelease != 'true'
        run: cp packaging/runtime_hooks/stable.py runtime-hook.py
      - name: Build application
        run: python -m PyInstaller --noconfirm --windowed --name BlueLCMS ${{ runner.os == 'Windows' && '--icon packaging/windows/bluelcms.ico' || '' }} --hidden-import PySide6.QtDBus --collect-data psims --collect-data bluelcms --add-data "packaging/linux/bluelcms.svg${{ runner.os == 'Windows' && ';' || ':' }}." --runtime-hook runtime-hook.py --paths src packaging/entrypoints/app.py
      - name: Package Linux archive
        if: runner.os == 'Linux'
        run: mkdir package && cp -R dist/BlueLCMS package/ && cp packaging/linux/BlueLCMS.desktop packaging/linux/install.sh packaging/linux/bluelcms.svg package/ && tar -C package -czf dist/${{ matrix.artifact }} .
      - name: Package macOS disk image
        if: runner.os == 'macOS'
        run: hdiutil create -volname BlueLCMS -srcfolder dist/BlueLCMS.app -ov -format UDZO dist/${{ matrix.artifact }}
      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup --no-progress --yes
      - name: Package Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: $env:BLUELCMS_VERSION="${{ needs.version.outputs.version }}"; iscc packaging/windows/BlueLCMS.iss; Move-Item dist/BlueLCMS-setup.exe dist/${{ matrix.artifact }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
  publish:
    needs: [version, package]
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare changelog release notes
        run: python packaging/release_version.py --notes "${{ needs.version.outputs.version }}"
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Check whether this is the newest development commit
        id: latest
        if: github.ref == 'refs/heads/dev'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api repos/${{ github.repository }}/git/ref/heads/dev --jq .object.sha)
          if [ "$head" = "${{ github.sha }}" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish numbered GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: BlueLCMS ${{ needs.version.outputs.tag }}
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.version.outputs.prerelease == 'true' && 'false' || 'true' }}
          body_path: release-notes.md
          files: release-assets/*
      - name: Move development release tag
        if: github.ref == 'refs/heads/dev' && steps.latest.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PATCH repos/${{ github.repository }}/git/refs/tags/dev-latest -f sha=${{ github.sha }} -F force=true || gh api --method POST repos/${{ github.repository }}/git/refs -f ref=refs/tags/dev-latest -f sha=${{ github.sha }}
      - name: Publish development GitHub release asset
        if: github.ref == 'refs/heads/dev' && steps.latest.outputs.current == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-latest
          target_commitish: ${{ github.sha }}
          name: Development latest (${{ needs.version.outputs.tag }})
          prerelease: true
          make_latest: false
          body_path: release-notes.md
          files: release-assets/*
