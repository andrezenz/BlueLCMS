name: Package release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: BlueLCMS-linux-x86_64.tar.gz
          - os: macos-latest
            artifact: BlueLCMS-macos.dmg
          - os: windows-latest
            artifact: BlueLCMS-windows-setup.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install --upgrade pip pyinstaller .
      - name: Build application
        run: python -m PyInstaller --noconfirm --windowed --name BlueLCMS --paths src src/bluelcms/__main__.py
      - name: Package Linux archive
        if: runner.os == 'Linux'
        run: mkdir package && cp dist/BlueLCMS package/ && cp packaging/linux/* package/ && tar -C package -czf dist/${{ matrix.artifact }} .
      - name: Package macOS disk image
        if: runner.os == 'macOS'
        run: hdiutil create -volname BlueLCMS -srcfolder dist/BlueLCMS.app -ov -format UDZO dist/${{ matrix.artifact }}
      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup --no-progress --yes
      - name: Package Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: $env:BLUELCMS_VERSION="${{ github.ref_name }}"; iscc packaging/windows/BlueLCMS.iss; Move-Item dist/BlueLCMS-setup.exe dist/${{ matrix.artifact }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
      - name: Publish GitHub release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.artifact }}
