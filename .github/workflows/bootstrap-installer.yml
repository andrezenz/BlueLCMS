name: Build website installer

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: BlueLCMS-installer-linux-x86_64
          - os: macos-latest
            artifact: BlueLCMS-installer-macos
          - os: windows-latest
            artifact: BlueLCMS-installer-windows.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pyinstaller .
      - run: python -m PyInstaller --noconfirm --onefile --windowed --name ${{ matrix.artifact }} --paths src packaging/entrypoints/installer.py
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}*
